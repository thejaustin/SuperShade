name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Build & publish release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          BUILD=$(( GITHUB_RUN_NUMBER + 1000 ))
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "name=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "code=${BUILD}" >> "$GITHUB_OUTPUT"

      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > "$GITHUB_WORKSPACE/app/supershade.keystore"
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/app/supershade.keystore" >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease \
            "-PversionName=${{ steps.version.outputs.name }}" \
            "-PversionCode=${{ steps.version.outputs.code }}" \
            --no-daemon

      - name: Rename APK
        run: |
          mv app/build/outputs/apk/release/app-release.apk \
             "app/build/outputs/apk/release/supershade-${{ steps.version.outputs.tag }}.apk"

      - name: Extract release notes
        run: |
          VERSION="${{ steps.version.outputs.name }}"
          if [ -f CHANGELOG.md ]; then
            awk "/^## \[${VERSION}\]/{flag=1; next} /^## \[/{flag=0} flag" CHANGELOG.md \
              > /tmp/release_notes.md
          fi
          if [ ! -s /tmp/release_notes.md ]; then
            echo "Release ${{ steps.version.outputs.tag }}" > /tmp/release_notes.md
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: "SuperShade ${{ steps.version.outputs.tag }}"
          body_path: /tmp/release_notes.md
          files: "app/build/outputs/apk/release/supershade-${{ steps.version.outputs.tag }}.apk"
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
