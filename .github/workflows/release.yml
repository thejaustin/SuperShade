name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    name: Build & publish release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Extract version from tag (strips leading 'v')
      - name: Extract version
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          # Build number from run number to ensure monotonically increasing versionCode
          BUILD=$(( ${{ github.run_number }} + 1000 ))
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "name=$VERSION" >> $GITHUB_OUTPUT
          echo "code=$BUILD" >> $GITHUB_OUTPUT

      # Decode keystore from base64 secret
      - name: Decode keystore
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > ${{ github.workspace }}/app/supershade.keystore

      - name: Build release APK
        run: |
          ./gradlew :app:assembleRelease \
            -PversionName=${{ steps.version.outputs.name }} \
            -PversionCode=${{ steps.version.outputs.code }} \
            --no-daemon
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/app/supershade.keystore
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}

      - name: Rename APK
        run: |
          mv app/build/outputs/apk/release/app-release.apk \
             app/build/outputs/apk/release/supershade-${{ steps.version.outputs.tag }}.apk

      # Extract release notes from CHANGELOG.md for this tag's section.
      # Falls back to the tag annotation message if no CHANGELOG entry found.
      - name: Extract release notes
        id: notes
        run: |
          if [ -f CHANGELOG.md ]; then
            # Grab lines between "## [<version>]" and the next "## [" heading
            NOTES=$(awk "/^## \[${{ steps.version.outputs.name }}\]/{flag=1; next} /^## \[/{flag=0} flag" CHANGELOG.md)
            if [ -z "$NOTES" ]; then
              NOTES="Release ${{ steps.version.outputs.tag }}"
            fi
          else
            NOTES="Release ${{ steps.version.outputs.tag }}"
          fi
          # Store multi-line output safely
          {
            echo 'notes<<EOF'
            echo "$NOTES"
            echo 'EOF'
          } >> $GITHUB_OUTPUT

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: SuperShade ${{ steps.version.outputs.tag }}
          body: ${{ steps.notes.outputs.notes }}
          files: app/build/outputs/apk/release/supershade-${{ steps.version.outputs.tag }}.apk
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
